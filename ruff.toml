# Most Python here is stdlib data tooling; the manual screenshot renderer also uses Pillow and wowmock.
line-length = 120
target-version = "py312"

# Vendored byte for byte by sift setup; sift update refreshes them.
extend-exclude = [".sift/gate.py", ".sift/agents.py"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Imports wowmock after putting its directory on sys.path.
"tools/screenshots.py" = ["E402"]
