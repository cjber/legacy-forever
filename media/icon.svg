<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Legacy Here</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset="1" stop-color="#080c14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a4f14"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d6a8"/>
      <stop offset="1" stop-color="#b8975c"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb27a"/>
      <stop offset="1" stop-color="#94743d"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#9a5e12"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="20" fill="url(#bg)"/>

  <!-- folded map, three panels -->
  <g transform="translate(0 8)">
    <path d="M40 150 L92 132 L92 214 L40 232 Z" fill="url(#parch)" stroke="#5a3a12" stroke-width="4" stroke-linejoin="round"/>
    <path d="M92 132 L164 150 L164 232 L92 214 Z" fill="url(#fold)" stroke="#5a3a12" stroke-width="4" stroke-linejoin="round"/>
    <path d="M164 150 L216 132 L216 214 L164 232 Z" fill="url(#parch)" stroke="#5a3a12" stroke-width="4" stroke-linejoin="round"/>
    <path d="M52 200 C70 186 84 204 104 190 S140 186 152 204 S190 196 206 176" fill="none" stroke="#7a4f14"
      stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round"/>
  </g>

  <!-- pin with Legacy gem -->
  <path d="M128 208 C112 178 78 150 78 108 A50 50 0 0 1 178 108 C178 150 144 178 128 208 Z" fill="#000" opacity="0.45"
    transform="translate(4 5)"/>
  <path d="M128 208 C112 178 78 150 78 108 A50 50 0 0 1 178 108 C178 150 144 178 128 208 Z" fill="url(#gold)"
    stroke="#4a2c08" stroke-width="5" stroke-linejoin="round"/>
  <path d="M128 70 L154 106 L128 142 L102 106 Z" fill="url(#gem)" stroke="#5a360c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 78 L146 104 L110 104 Z" fill="url(#shine)"/>
  <path d="M96 76 A40 40 0 0 1 160 76" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
</svg>
