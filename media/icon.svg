  <path d="M78 52 H48 C38 52 32 60 32 72 C32 104 58 124 94 130 L92 114 C64 108 48 92 48 74 C48 70 50 68 54 68 H78 Z M 178 52 H 208 C 218 52 224 60 224 72 C 224 104 198 124 162 130 L 164 114 C 192 108 208 92 208 74 C 208 70 206 68 202 68 H 178 Z M66 202 H190 V218 H66 Z M80 206 C80 186 102 174 128 174 C154 174 176 186 176 206 Z M114 144 H142 L138 176 H118 Z M70 38 H186 V74 C186 118 162 142 128 146 C94 142 70 118 70 74 Z" fill="#000" opacity="0.45" transform="translate(4 5)"/>
  <path d="M78 52 H48 C38 52 32 60 32 72 C32 104 58 124 94 130 L92 114 C64 108 48 92 48 74 C48 70 50 68 54 68 H78 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 178 52 H 208 C 218 52 224 60 224 72 C 224 104 198 124 162 130 L 164 114 C 192 108 208 92 208 74 C 208 70 206 68 202 68 H 178 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M66 202 H190 V218 H66 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M80 206 C80 186 102 174 128 174 C154 174 176 186 176 206 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M114 144 H142 L138 176 H118 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M70 38 H186 V74 C186 118 162 142 128 146 C94 142 70 118 70 74 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M84 48 H172 V72 C172 80 170 88 166 96 H90 C86 88 84 80 84 72 Z" fill="url(#shine)"/>
  <path d="M128.0 66.0 L134.5 83.1 L152.7 84.0 L138.5 95.4 L143.3 113.0 L128.0 103.0 L112.7 113.0 L117.5 95.4 L103.3 84.0 L121.5 83.1 Z" fill="#5a360c"/>
</svg>
