name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y luajit lua-check
      - run: luacheck .
      - run: pipx run ruff==0.16.8 format --check .
      - run: pipx run ruff==0.16.8 check .
      - run: for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lua types and multi-value argument lint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luals.tgz" \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/luals.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/luals" && tar -xzf "$RUNNER_TEMP/luals.tgz" -C "$RUNNER_TEMP/luals"
          LUA_LANGUAGE_SERVER="$RUNNER_TEMP/luals/bin/lua-language-server" tools/typecheck.sh

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 and actionlint 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256sum -c - <<'SUMS'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz
          SUMS
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --no-banner .
      - run: actionlint
      - run: pipx run zizmor==1.30.1 --offline .github

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sift's AGENTS.md check, pinned by commit and sha256 (WFA-17).
      - name: AGENTS.md is complete and current
        run: |
          curl -sSfL -o "$RUNNER_TEMP/agents.py" https://raw.githubusercontent.com/agent-labs-dev/sift/feda7ef68af0c50e3e428f04bab2ad762fda6ea1/skills/sift/scripts/agents.py
          echo "8ddabf0f671d502f974790c51c926b82a41fc7f375009f19551250b889b12f23  $RUNNER_TEMP/agents.py" | sha256sum -c -
          python3 "$RUNNER_TEMP/agents.py" check
