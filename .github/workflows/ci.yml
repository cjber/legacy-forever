name: CI

on:
  push:
    branches: [main]
  pull_request:
  # refresh-data.yml runs this on its data PR branch.
  workflow_dispatch:

permissions:
  contents: read

# PyPI answers 502/504 under load; pip's own retries cover it.
env:
  PIP_RETRIES: 5
  PIP_DEFAULT_TIMEOUT: 60

jobs:
  deadcode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - run: luacheck .
      - run: python3 -m tools.forever_tools.assets
      - run: pipx run ruff==0.16.8 format --check .
      - run: pipx run ruff==0.16.8 check .
      - run: for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/sync.py check
      - run: python3 tools/forever_sim/fetch.py
      - run: luajit tools/forever_sim/run.lua
      # The load and redraw cost bench: it fails on a Lua error in any file it loads.
      - run: luajit tools/perf_bench.lua
      # A screenshot older than the code it is drawn from (docs/screenshots/scenes.sha256).
      - run: python3 tools/check_screenshots.py
      - name: Native tracker integration
        run: |
          python3 tools/fetch_tracker_ui.py
          TRACKER_UI_ROOT=tools/.cache/tracker-ui luajit tests/tracker_host_spec.lua
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/check_locales.py parses each translation with LuaJIT.
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - name: Lua types and multi-value argument lint
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -fsSL -o "$RUNNER_TEMP/luals.tgz" \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/luals.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/luals" && tar -xzf "$RUNNER_TEMP/luals.tgz" -C "$RUNNER_TEMP/luals"
          LUA_LANGUAGE_SERVER="$RUNNER_TEMP/luals/bin/lua-language-server" tools/typecheck.sh

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py', 'tools/db2.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - run: python3 tools/check_generated.py

  project-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release publishes its changelog entry, so every tagged version needs one.
      - run: python3 tools/changelog.py --check
      - env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: python3 tools/repo_rules.py --base "origin/$BASE"

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
      - run: '"$RUNNER_TEMP/actionlint"'
      - run: pipx run zizmor==1.30.1 --offline .github

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  # What a tag would ship, checked before it ships: the release workflow's packager without uploading or zipping,
  # then tools/check_package.py on .release/ (every loaded file present, no development folders, specs pass on it).
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      # .pkgmeta's manual changelog, which the release fills with the version's entry.
      - run: printf 'Package check\n' > .release-notes.md
      # The packager skips a push build when HEAD carries a tag ("Found future tag, not packaging"), so a tag that
      # lands while this run is in flight would fail this job and leave main without the green run a release starts
      # from. This job checks what a tag would ship, so hide HEAD's tags and let the dry run build what an ordinary
      # push to main builds.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - run: python3 tools/check_package.py
