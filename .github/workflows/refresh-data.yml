name: Refresh Legacy data

# Opens a PR with regenerated data when wago.tools lists a newer Forever build.
# The Lua checks run here before the PR opens; the ci job then approves the PR's CI, which GitHub holds
# because GITHUB_TOKEN opened it.
# A failed run on the default branch opens the "Data refresh failed" issue, or comments on it.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates with its own `token` input.
          persist-credentials: false
      # Pinned inputs CI already downloaded, such as frozen dumps and the forever-db zip; each file is keyed by
      # its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py', 'tools/db2.py', 'tools/fdb_pin.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      # The regression guard below diffs the data the current pins built against the regenerated one, so set
      # the committed file aside before the pins move.
      - name: Snapshot the committed data
        run: cp Data/Legacy.lua "$RUNNER_TEMP/legacy-prev.lua"
      - name: Pin the newest Forever build and forever-db release
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_legacy.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/; s/^SOURCE_DATE = \".*\"/SOURCE_DATE = \"$(date -u +%F)\"/" tools/gen_legacy.py
          # The guard reads forever-db as the second source; its pin follows the newest release.
          python3 tools/refresh_fdb.py
      # Every version lives in tools/toolchain.json; the action installs and verifies each pin from it. The
      # guard's dump runs under luajit, so the toolchain installs before the generator runs.
      - if: steps.build.outputs.new == 'true'
        uses: cjber/forever-core/.github/actions/toolchain@3776350a0b7bd71448ac7a8db8bf58d60303b4d3 # main
        with:
          tools: lua stylua
      - if: steps.build.outputs.new == 'true'
        run: |
          python3 tools/gen_legacy.py
          python3 tools/check_generated.py --offline
      # Fails the run on data a player could lose: an objective that lost every zone it had while its
      # achievement is still a reward or feed, a pin or drawn explore key, a feed link, a drawn area's tiles,
      # or a wing, raid boss or Legacy entry reference; gains, moves and drops are only reported. The zip is
      # the one this run's pin names, fetched into tools/.cache under its sha256.
      - if: steps.build.outputs.new == 'true'
        name: Check the refresh for regressions
        run: |
          fdb="tools/.cache/fdb-$(PYTHONPATH=tools python3 -c 'import fdb_pin; print(fdb_pin.FDB_SHA256)').zip"
          python3 tools/check_refresh.py --old "$RUNNER_TEMP/legacy-prev.lua" --new Data/Legacy.lua --fdb "$fdb"
      - if: steps.build.outputs.new == 'true'
        name: Read the ForeverCore ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.new == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      - if: steps.build.outputs.new == 'true'
        env:
          FOREVER_CORE: forever-core
        run: |
          luacheck .
          python3 -m tools.forever_tools.specs
      - if: steps.build.outputs.new == 'true'
        run: stylua --check .
      - if: steps.build.outputs.new == 'true'
        id: report
        run: |
          {
            echo 'markdown<<REPORT_EOF'
            python3 tools/data_report.py
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
      - if: steps.build.outputs.new == 'true'
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: Legacy data for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: Legacy data for Forever ${{ steps.build.outputs.version }}"
          # GitHub signs these commits when the action uses GITHUB_TOKEN.
          sign-commits: true
          body: |
            Regenerated `Data/Legacy.lua` from the achievement, criteria and world map DB2s of Forever build ${{ steps.build.outputs.version }}.

            ${{ steps.report.outputs.markdown }}

            The refresh guard diffed the committed data against this one; its report is in the run log. The forever-db pin ${{ steps.build.outputs.fdb }}.

            Before merging, read the diff of `Data/Legacy.lua` for renamed or moved objectives, and run `/lf audit` in-game to confirm every located objective is one the client knows.

            The workflow that opened this PR also approved its CI, so the required checks run without a maintainer's approval.

  # GitHub holds every pull_request run on a PR that GITHUB_TOKEN opened until someone with write access approves
  # it, and the required checks include ones only those runs report. Approve the PR commit's held runs. GitHub
  # creates them a few seconds after the push.
  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Approve the PR's held workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          for _ in $(seq 30); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.id) \(.conclusion)"')
            held=$(printf '%s\n' "$runs" | awk '$2 == "action_required" { print $1 }')
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              echo "Approved run $id"
            done
            if [ -n "$runs" ] && [ -z "$held" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The pull_request runs for $SHA were not created or not approved"
          exit 1

  # A refresh that fails every day unnoticed is how the data falls behind: keep one open issue saying so.
  report:
    needs: [refresh, ci]
    # The first attempt stays quiet: retry-refresh.yml re-runs it, and only a failed re-run is reported.
    if: failure() && github.run_attempt > 1 && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The data refresh failed: $RUN_URL

          If the failed step is \`Check the refresh for regressions\`, the regenerated data lost something the committed data had: read that step's REGRESSIONS and forever-db's evidence, decide whether the client dropped the content or the guard caught a broken join, and close this issue once a run passes. Re-running fails the same way. Otherwise the generator rejects client data it cannot place: read the error in that run, correct \`tools/locations.json\` or the generator from the new client rows, and close this issue once a run passes."
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
