name: Refresh Legacy data

# Opens a PR with regenerated data when wago.tools lists a newer Forever build.
# CI on a PR opened with GITHUB_TOKEN waits for a maintainer's approval, so the Lua checks run here
# first and the ci job dispatches the full CI on the PR's branch.
# A failed run on the default branch opens the "Data refresh failed" issue, or comments on it.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates with its own `token` input.
          persist-credentials: false
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_legacy.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/; s/^SOURCE_DATE = \".*\"/SOURCE_DATE = \"$(date -u +%F)\"/" tools/gen_legacy.py
      - if: steps.build.outputs.new == 'true'
        run: |
          python3 tools/gen_legacy.py
          python3 tools/check_generated.py --offline
      - if: steps.build.outputs.new == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y luajit lua-check
          luacheck .
          for spec in tests/*_spec.lua; do luajit "$spec" || exit 1; done
      - if: steps.build.outputs.new == 'true'
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.build.outputs.new == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: Legacy data for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: Legacy data for Forever ${{ steps.build.outputs.version }}"
          body: |
            Regenerated `Data/Legacy.lua` from the achievement, criteria and world map DB2s of Forever build ${{ steps.build.outputs.version }}.

            Before merging, read the diff of `Data/Legacy.lua` for renamed or moved objectives, and run `/lf audit` in-game to confirm every located objective is one the client knows.

            CI is dispatched on this branch straight away; approve the pending workflows on this PR too, since only those count as its required checks.

  # The data PR's own CI waits for approval because GITHUB_TOKEN opened it, so run CI on its branch
  # now; a dispatched run shows under Actions, not in the PR's checks.
  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.refresh.outputs.branch }}

  # A refresh that fails every day unnoticed is how the data falls behind: keep one open issue saying so.
  report:
    needs: [refresh, ci]
    if: failure() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Data refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The data refresh failed: $RUN_URL

          The generator rejects client data it cannot place, so read the error in that run, correct \`tools/locations.json\` or the generator from the new client rows, and close this issue once a run passes."
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
