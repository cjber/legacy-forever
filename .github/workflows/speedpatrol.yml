name: Speedpatrol

# A/B timing of the pull request against its base on the harness bench (.speedpatrol/speedpatrol.yml), posted as one
# comment. Only harness.perf runs: the spec-suite timing is for local patrols, not a pull request check.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Read relative to each checkout: the PR side finds the core checked out below, and the base checkout under
      # .speedpatrol/runs finds the copy its own prepare step clones from its own pin (cjber/skillup-forever#550).
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Forever Core ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - uses: agent-labs-dev/speedpatrol@06264b336597ed9977b289a3a86c1a0ce4c3fe62 # v0
        with:
          benchmarks: harness.perf
          fail-on-regression: true
          rounds: 3
          package: speedpatrol@0.2.0
