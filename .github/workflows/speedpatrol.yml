name: Speedpatrol

# A/B timing of the pull request against its base on the harness bench (.speedpatrol/speedpatrol.yml), posted as one
# comment. Only harness.perf runs: the spec-suite timing is for local patrols, not a pull request check.
on:
  pull_request:
    # labeled re-runs the timing when the "speedpatrol: accept" label is added; naming types replaces the defaults.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Read relative to each checkout: the PR side finds the core checked out below, and the base checkout under
      # .speedpatrol/runs finds the copy its own prepare step clones from its own pin (cjber/skillup-forever#550).
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Every version lives in tools/toolchain.json; the action installs and verifies each pin from it.
      - uses: cjber/forever-core/.github/actions/toolchain@2596f68e68f9a727496a19f3f801c8a7039357d2 # main
        with:
          tools: lua
      - uses: agent-labs-dev/speedpatrol@6f86e2ea61e004c78c18de41ad052c9f55ab5a19 # v0
        with:
          benchmarks: harness.perf
          fail-on-regression: true
          rounds: 3
          package: speedpatrol@0.2.0
